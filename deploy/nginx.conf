# ── UgaMarket production reverse proxy ───────────────────────────────────────
# Single nginx service serving BOTH static frontends and proxying the backend.
#   - port 80  : customer web (default_server)
#   - port 8080: admin web (own origin; map an admin subdomain here in production)
#
# TLS: terminate at this proxy in production. Certificates are NOT committed —
# mount them at /etc/nginx/certs and switch the `listen` directives, e.g.:
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
# Never place private keys inside the repository.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # Backend accepts image uploads up to 5 MB (multer limit) plus overhead.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── Customer web ───────────────────────────────────────────────────────────
  server {
    listen 80 default_server;
    # Production TLS (placeholder — see comment above):
    # listen 443 ssl;

    root /usr/share/nginx/html/customer;
    index index.html;

    # Backend API — keep as a backend route; never fall through to the SPA.
    location /api/ {
      proxy_pass http://backend:4000;
    }

    # Uploaded product images — backend route, persistent volume behind it.
    location /images/ {
      proxy_pass http://backend:4000;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback for customer routes.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # ── Admin web ──────────────────────────────────────────────────────────────
  # Served on its own origin (separate listen) so the Vite build keeps its
  # default '/' base path. In production, put this behind the admin domain
  # (server_name admin.<domain>) or a dedicated TLS listener.
  server {
    listen 8080;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
      proxy_pass http://backend:4000;
    }

    location /images/ {
      proxy_pass http://backend:4000;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
